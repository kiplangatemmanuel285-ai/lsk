<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Masomo Portal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eaf0f8;
        }

        header {
            background: #003366;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 400px;
            margin: 50px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 12px #ccc;
        }

        h2 {
            text-align: center;
            color: #003366;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-top: 20px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 6px;
            background: #00509e;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #003366;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #00509e;
            text-decoration: none;
        }

        #message {
            margin-top: 15px;
            color: #166534;
        }
    </style>
</head>

<body>

<header>
    <h1>MASOMO PORTAL</h1>
    <p style="color:white;">Student Learning System</p>
</header>

<div class="container">

    <h2>Forgot Password?</h2>

    <p>
        Forgot your password? Enter the email address
        associated with your student account to request
        a password reset.
    </p>

    <form id="resetForm">

        <label for="email">Registered Email Address</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email address"
            required
        >

        <button type="submit">
            Reset Password
        </button>

    </form>

    <p id="message" role="status"></p>

    <div class="back">
        <a href="c:\Users\USER\masomo portal.html">← Back to Login</a>
    </div>

</div>

<script>
    document.getElementById("resetForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            document.getElementById("message").textContent =
                " connect a password-reset service to send a secure reset link.";
        });
</script>

</body>
</html>
